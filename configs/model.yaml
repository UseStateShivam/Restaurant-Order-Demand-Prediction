# Model Configuration for Restaurant Order Demand Prediction
model:
  target_name: "num_orders"
  target_units: "orders_per_week"
  random_seed: 42

  baseline:
    strategy: "group_median"
    fallback_strategy: "global_median"
    group_columns:
      - "center_id"
      - "meal_id"

  candidate:
    algorithm: "hist_gradient_boosting"
    hyperparameters:
      max_iter: 200
      learning_rate: 0.08
      max_depth: 12
      min_samples_leaf: 25
      l2_regularization: 0.5
      random_state: 42

  comparison:
    algorithm: "random_forest"
    hyperparameters:
      n_estimators: 100
      max_depth: 14
      min_samples_leaf: 20
      random_state: 42
      n_jobs: -1

  evaluation:
    metrics:
      - "mae"
      - "rmse"
      - "r2"
      - "wape"
      - "medae"

  artifacts:
    model_dir: "models"
    pipeline_filename: "restaurant_demand_pipeline.joblib"
    metadata_filename: "model_metadata.json"
    metrics_filename: "metrics_report.json"
